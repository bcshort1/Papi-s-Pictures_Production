<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Papi's Pictures</title>
    <link rel="shortcut icon" href="/assets/logos_and_thumbnails/logo-137x139.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Raleway:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="/admin.css">
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="/assets/logos_and_thumbnails/logo-137x139.png" alt="Papi's Pictures Logo" class="login-logo">
                <h1>Papi's Pictures</h1>
                <p>Create an Account</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password"
                        minlength="6" placeholder="At least 6 characters">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                        autocomplete="new-password" placeholder="Re-enter your password">
                </div>
                <div id="registerError" class="error-message" style="display:none;"></div>
                <button type="submit" class="login-btn">Create Account</button>
            </form>
            <p style="text-align:center; margin-top:1.25rem; font-size:0.9rem;">
                Already have an account? <a href="/login">Sign in</a>
            </p>
        </div>
    </div>

    <script>
        //Handle registration form submission. Posts username/password to /api/register and,
        //on success, lands on / because new accounts are non-admin.
        document.getElementById('registerForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            var errorDiv = document.getElementById('registerError');
            errorDiv.style.display = 'none';

            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            //Client-side guard so the server never sees mismatched passwords.
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                var response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await response.json();

                if (response.ok && data.success) {
                    //Public registration only ever creates non-admin accounts, so always
                    //land on the homepage rather than the admin panel.
                    window.location.href = '/';
                } else {
                    //Display the error message returned by the server.
                    errorDiv.textContent = data.error || 'Registration failed';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Unable to connect to the server. Please try again.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
