<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Papi's Pictures</title>
    <link rel="shortcut icon" href="/assets/logos_and_thumbnails/logo-137x139.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Raleway:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="/admin.css">
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="/assets/logos_and_thumbnails/logo-137x139.png" alt="Papi's Pictures Logo" class="login-logo">
                <h1>Papi's Pictures</h1>
                <p>Admin Panel Login</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        placeholder="Enter your password">
                </div>
                <div id="loginError" class="error-message" style="display:none;"></div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        //Posts to /api/admin/login, which rejects any non-admin credentials with a generic
        //401. Admin-only flow — no register link because new admins are created by existing
        //admins through the admin panel, not through public signup.
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            var errorDiv = document.getElementById('loginError');
            errorDiv.style.display = 'none';

            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;

            try {
                var response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = '/admin';
                } else {
                    errorDiv.textContent = data.error || 'Login failed';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Unable to connect to the server. Please try again.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
